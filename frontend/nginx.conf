# frontend/nginx.conf

server {
  listen 80;
  server_name localhost;

  # Root directory for the static files
  root /usr/share/nginx/html;
  index index.html index.htm;

  # This is the key part for single-page applications (SPAs).
  # It tries to find the file requested, and if it doesn't exist (e.g., /dashboard),
  # it falls back to serving index.html. React Router then handles the route.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: Gzip compression for better performance
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
}
