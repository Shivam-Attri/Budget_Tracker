services:
  # The database service
  db:
    image: postgres:15-alpine
    container_name: budget_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=budget
    ports:
      # Expose the database port to the host machine for debugging/inspection.
      - "5432:5432"
    volumes:
      # Persist database data on the host machine.
      - postgres_data:/var/lib/postgresql/data

  # The Go backend API service
  backend:
    container_name: budget_api
    # Build the image from the Dockerfile in the 'backend' directory.
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # CORRECTED: The backend connects to the 'db' service by its name, not 'localhost'.
      - BUDGET_DB_URL=postgres://postgres:mysecretpassword@db:5432/budget?sslmode=disable
      - BUDGET_JWT_SECRET=${JWT_SECRET}
      - BUDGET_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - db
    env_file:
      - ./backend/.env

  # The React frontend service
  frontend:
    container_name: budget_ui
    # Build the image from the Dockerfile in the 'frontend' directory.
    build: ./frontend
    restart: always
    ports:
      # Expose the frontend on port 3000 of your local machine.
      - "3000:80"
    # No environment variables needed here if the API URL is hardcoded or handled at build time
    depends_on:
      - backend

volumes:
  # Define the named volume for data persistence.
  postgres_data:
